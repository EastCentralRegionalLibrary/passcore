name: CI - Testing

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # Measured over the last 29 successful runs: median 2.7 minutes, 26 of them
    # under 3, and a tail to 21.1 when "Install Playwright Browsers" is slow --
    # that step runs `npx playwright install --with-deps`, which shells out to
    # apt-get and is at the mercy of mirror speed. 30 leaves roughly nine
    # minutes of headroom above the slowest run that has ever passed.
    #
    # The point is the other end. With no timeout this job inherits GitHub's
    # six-hour default, and on 2026-08-18 that same apt-get step hung for over
    # 70 minutes and would have held a runner for the rest of it.
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      ASPNETCORE_ENVIRONMENT: Test
      ASPNETCORE_URLS: http://localhost:5000

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # -------------------------
      # Tooling setup
      # -------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Unosquare.PassCore.Web/ClientApp/package-lock.json

      # -------------------------
      # Backend build + tests
      # -------------------------
      - name: Restore .NET dependencies
        run: |
          dotnet restore \
            src/Unosquare.PassCore.Web/Unosquare.PassCore.Web.csproj \
            --property:PASSCORE_PROVIDER=DEBUG

      - name: Build Backend (Debug)
        run: |
          dotnet build \
            src/Unosquare.PassCore.Web/Unosquare.PassCore.Web.csproj \
            --configuration Debug \
            --property:PASSCORE_PROVIDER=DEBUG \
            --no-restore

      - name: Run Frontend Typecheck and Lint
        run: |
          npm run typecheck
          npm run lint
        working-directory: src/Unosquare.PassCore.Web/ClientApp

      - name: Run Backend Unit Tests
        run: |
          set -euo pipefail
          for proj in \
            tests/Unosquare.PassCore.Common.Tests/Unosquare.PassCore.Common.Tests.csproj \
            tests/Unosquare.PassCore.PasswordProvider.Debug.Tests/Unosquare.PassCore.PasswordProvider.Debug.Tests.csproj \
            tests/Zyborg.PassCore.PasswordProvider.LDAP.Tests/Zyborg.PassCore.PasswordProvider.LDAP.Tests.csproj \
            tests/PwnedPasswordsSearch.Tests/PwnedPasswordsSearch.Tests.csproj
          do
            echo "==> Testing $proj"
            # `dotnet test` exits 0 when it discovers nothing -- it just prints
            # "No test is available" -- so a project/SDK configuration slip can
            # reduce this whole step to a green no-op. That is exactly what
            # happened: the test projects set TargetFramework while
            # Directory.Build.props set TargetFrameworks, the package .props
            # imports were skipped, the xunit VSTest adapter never reached the
            # output directory, and CI reported success while running zero
            # assertions. Capture the output and fail loudly if it recurs.
            output=$(dotnet test "$proj" \
              --configuration Debug \
              --logger "trx;LogFileName=test-results.trx" \
              --logger "console;verbosity=normal" 2>&1) || {
                echo "$output"
                exit 1
              }
            echo "$output"

            if grep -qF 'No test is available' <<<"$output"; then
              echo "::error file=$proj::No tests were discovered in $proj, so this run passed vacuously. Usually the xunit VSTest adapter did not reach the output directory: check that the project declares TargetFrameworks (plural), so that the package .props imports apply."
              exit 1
            fi
          done

      - name: Upload .NET Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-results
          path: tests/**/TestResults/*.trx
          retention-days: 7
          if-no-files-found: ignore


      # -------------------------
      # Frontend setup
      # -------------------------
      # - name: Install frontend dependencies
      #   run: npm ci
      #   working-directory: src/Unosquare.PassCore.Web/ClientApp
      # This should already have been completed as part of the build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox
        working-directory: src/Unosquare.PassCore.Web/ClientApp

      # -------------------------
      # Start backend (no rebuild!)
      # -------------------------
      - name: Start Backend
        shell: bash
        run: |
          dotnet run \
            --no-launch-profile \
            --project src/Unosquare.PassCore.Web/Unosquare.PassCore.Web.csproj \
            --configuration Debug \
            --framework net8.0 \
            --property:PASSCORE_PROVIDER=DEBUG \
            --no-build &

          echo $! > backend.pid

      - name: Wait for Backend to be ready
        run: |
          echo "Waiting for backend..."
          timeout 90s bash -c '
            until curl -fsS http://localhost:5000/api/password; do
              sleep 3
            done
          '

      # -------------------------
      # E2E Tests
      # -------------------------
      - name: Run Playwright E2E Tests
        run: npx playwright test
        working-directory: src/Unosquare.PassCore.Web/ClientApp

      # -------------------------
      # Cleanup (always!)
      # -------------------------
      - name: Stop Backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

      # -------------------------
      # Artifacts on failure
      # -------------------------
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: src/Unosquare.PassCore.Web/ClientApp/playwright-report
          retention-days: 7

      - name: Upload Playwright Test Results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: src/Unosquare.PassCore.Web/ClientApp/test-results
          retention-days: 7
