name: AD Provider Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke-test:
    permissions:
      contents: read      # Needed to check out code
      actions: write      # Needed for cancel-workflow-action to stop old runs
    name: AD Provider Smoke Test on Windows Latest
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      ASPNETCORE_ENVIRONMENT: ADTest
      ASPNETCORE_URLS: http://localhost:5000

    steps:
      - name: Cancel previous runs
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup WSL 2
        uses: Vampire/setup-wsl@v7
        with:
          additional-packages: podman ca-certificates

      - name: Configure Podman for Headless WSL Environment
        shell: wsl-bash {0}
        run: |
          sudo mkdir -p /etc/containers/containers.conf.d
          cat <<'EOF' | sudo tee /etc/containers/containers.conf.d/ci-events.conf
          [engine]
          events_backend = "file"
          cgroup_manager = "cgroupfs"
          EOF

      - name: Start Samba AD DC inside WSL
        shell: wsl-bash {0}
        run: |
          # Convert Windows workspace path to a Linux mount path for Podman
          SEED_SCRIPT="$(wslpath '${{ github.workspace }}')/tests/samba-ad/seedusers.sh"
          # Fix CRLF line endings and make script executable
          sed -i 's/\r$//' "${SEED_SCRIPT}"
          chmod +x "${SEED_SCRIPT}"

          # 88 (Kerberos) and 464 (kpasswd) are republished as part of a
          # TIME-BOXED EXPERIMENT, together with the static route added on the
          # Windows side further down. The two are one logical unit: the route
          # alone changes nothing observable, and republishing these ports alone
          # reproduces a known breakage. If the experiment fails they are removed
          # together.
          #
          # The known breakage, from the last time these were published: making
          # the hosts entries routable so the DC Locator could work also made the
          # KDC findable, at which point Negotiate began preferring Kerberos,
          # failed, and did NOT fall back to NTLM -- so every bind broke,
          # including the minPwdLength read that had been passing. Expect a broad
          # red rather than a targeted one if that recurs; it is not a new fault.
          #
          # The hypothesis being tested: DNS SRV responses carry glue A records in
          # the additional section, so when the Kerberos client resolves
          # _kerberos._tcp.example.com it can take dc.example.com's accompanying
          # 10.88.x.x address directly, never performing the separate lookup the
          # hosts file would have intercepted -- and then dials an address Windows
          # cannot route to. If that is the mechanism, a route fixes it. Windows
          # does not need the container on its network, only a way to reach it.
          #
          # 389 is published for BOTH protocols, and the /udp is not incidental.
          # podman publishes TCP only when no protocol is given, so "-p 389:389"
          # left UDP 389 unpublished -- and UDP 389 is what the DC Locator needs.
          # Netlogon sends a CLDAP ping as an LDAP UDP search before connecting
          # over TCP; without a response it cannot confirm the server is a global
          # catalog or determine its site, and Forest.GetForest() fails. That is
          # exactly the signature seen: DNS resolving, tcp/3268 reachable, and
          # GetForest() still failing. GetAuthorizationGroups() was unaffected
          # throughout because tokenGroups is a base-scope read on an
          # already-bound TCP connection and never goes through the locator.
          #
          # The change-password investigation is separate and still open. Three
          # things were tried there, each verified working, with no change in
          # outcome:
          #
          #   1. 88 and 464 published -- all five ports confirmed reachable.
          #   2. The DC's CA trusted -- LDAPS binds to example.com:636 and
          #      dc.example.com:636 both confirmed succeeding from the runner.
          #   3. The provider bound with sign-and-seal -- the app logs
          #      "context established over sign-and-seal", with no SSL fallback.
          #
          # So the channel IS encrypted and signed, and SDSUtils.ChangePassword
          # still returns E_ACCESSDENIED. Whatever remains is not reachability,
          # not certificate trust, and not channel protection -- which is also
          # why unpublishing 88 and 464 above costs that investigation nothing.
          #
          # 135, 137-139 and 445 are deliberately NOT published: the Windows host
          # already binds them and the publish would fail.
          #
          # Fixed hostname so the DC's FQDN is deterministic (dc.example.com)
          # and can be mapped in the Windows hosts file below. Without it the
          # container gets a random id as its hostname and there is nothing
          # stable to map.
          #
          # Port 53 is published because System.DirectoryServices.ActiveDirectory
          # discovers the forest through DNS SRV records, which a hosts file
          # cannot express. Samba provisions its internal DNS server with the AD
          # zones already, so exposing the port is all that is required.
          #
          # DNS is bound to the WSL VM's own routable address, and neither to
          # 127.0.0.1 nor to all interfaces. Both of those fail, for different
          # reasons:
          #
          #   * 127.0.0.1:53:53 would bind the WSL VM's loopback. WSL2's
          #     localhost relay forwards TCP but not UDP, and DNS is UDP first,
          #     so Windows could not reach it.
          #   * 53:53 (all interfaces) collides with the distro's own resolver
          #     stub -- systemd-resolved holds 127.0.0.53:53, and a 0.0.0.0:53
          #     bind conflicts with it. That is the "address already in use"
          #     error that stopped the container from starting at all.
          #
          # eth0's address avoids the stub and is directly routable from Windows
          # over the vEthernet (WSL) adapter -- it is the same address the NRPT
          # rule below points at, so the two must agree.
          WSL_IP="$(hostname -I | awk '{print $1}')"
          echo "WSL VM IP for DNS publishing: ${WSL_IP}"

          podman run -d \
            --name samba-ad \
            --hostname dc \
            --privileged \
            -p 389:389/tcp -p 389:389/udp -p 636:636 \
            -p 3268:3268 -p 3269:3269 \
            -p 88:88/tcp -p 88:88/udp \
            -p 464:464/tcp -p 464:464/udp \
            -p ${WSL_IP}:53:53/udp -p ${WSL_IP}:53:53/tcp \
            -e DOMAIN="example.com" \
            -e DOMAINPASS="AdminPassword123!" \
            -e NOCOMPLEXITY="true" \
            docker.io/nowsci/samba-domain:latest

          # EXPERIMENT (time-boxed). Windows does not need the container on its
          # network, only a route to it. The WSL VM already forwards, because
          # podman requires ip_forward.
          #
          # The subnet is READ rather than assumed: netavark defaults to
          # 10.88.0.0/16, but a hardcoded value that quietly stopped matching
          # would produce a confusing negative result and this experiment is
          # only worth running if its negative is trustworthy.
          NETWORK_FILE="$(wslpath '${{ github.workspace }}')/podman-network.txt"

          PODMAN_SUBNET="$(podman network inspect podman --format '{{range .Subnets}}{{.Subnet}}{{end}}' 2>/dev/null)"
          if [ -z "${PODMAN_SUBNET}" ]; then
            # Older/other backends report a different shape; fall back to JSON.
            PODMAN_SUBNET="$(podman network inspect podman 2>/dev/null | grep -o '"subnet"[^,]*' | head -1 | sed 's/.*: *"//; s/"//')"
          fi

          CONTAINER_IP="$(podman inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' samba-ad 2>/dev/null)"

          echo "podman bridge subnet : ${PODMAN_SUBNET:-<unknown>}"
          echo "container address    : ${CONTAINER_IP:-<unknown>}"

          printf '%s\n%s\n' "${PODMAN_SUBNET}" "${CONTAINER_IP}" > "${NETWORK_FILE}"

      - name: Wait for Samba AD DC Provisioning
        shell: wsl-bash {0}
        run: |
          echo "Waiting for Samba AD DC schema and database provisioning..."

          MAX_RETRIES=30
          RETRY_COUNT=0
          READY=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # 1. Fail fast if container exited
            if [ "$(podman inspect -f '{{.State.Running}}' samba-ad 2>/dev/null)" != "true" ]; then
              echo "ERROR: Samba AD DC container exited unexpectedly!"
              echo "=== Samba Container Logs ==="
              podman logs samba-ad
              exit 1
            fi

            # 2. Check local LDB database directly (avoids network/DNS timeout hangs)
            if podman exec samba-ad ldbsearch -H /var/lib/samba/private/sam.ldb -b "CN=Schema,CN=Configuration,DC=example,DC=com" "(objectClass=*)" name >/dev/null 2>&1; then
              echo "Samba AD DC schema and sam.ldb are fully initialized!"
              READY=1
              break
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 2
          done

          if [ $READY -ne 1 ]; then
            echo "ERROR: Timed out waiting for Samba initialization after 60 seconds!"
            echo "=== Samba Container Logs ==="
            podman logs samba-ad
            exit 1
          fi

      - name: Seed Active Directory Users and Groups
        shell: wsl-bash {0}
        run: |
          SEED_SCRIPT="$(wslpath '${{ github.workspace }}')/tests/samba-ad/seedusers.sh"

          # Fix CRLF line endings from Windows git checkout
          sed -i 's/\r$//' "${SEED_SCRIPT}"

          # Copy script into container and execute it
          podman cp "${SEED_SCRIPT}" samba-ad:/tmp/seedusers.sh
          podman exec samba-ad /bin/sh /tmp/seedusers.sh

      # System.DirectoryServices.AccountManagement does not confine itself to the
      # server it was given. GetAuthorizationGroups() calls LoadDomainInfo(),
      # which resolves the domain by its DNS name and opens a fresh connection to
      # it -- so pointing the provider at "localhost" is not enough, and the call
      # failed with the domain unresolvable. That left group membership
      # undetermined, and the provider correctly refused the request rather than
      # treating "could not tell" as "not a member".
      #
      # Mapping the realm and the DC's FQDN to the published ports makes the
      # runner look enough like a domain member for that second connection to
      # succeed. The runner is administrator, so the hosts file is writable.
      #
      # Name resolution here is deliberately split between two mechanisms, and
      # both are required:
      #
      #   * The hosts entries below pin the A records for example.com and
      #     dc.example.com to 127.0.0.1, where 389/636 are published. They must
      #     NOT be "cleaned up" now that DNS is available: Samba's SRV records
      #     name dc.example.com, and Samba's own DNS answers that A query with
      #     the container's internal address (10.88.x.x), which Windows has no
      #     route to.
      #   * The NRPT rule below sends DNS queries for the zone to the container's
      #     DNS server, which is the only way to get the SRV records that
      #     Forest.GetForest() needs -- a hosts file cannot express SRV at all.
      #
      # Windows consults the hosts file before DNS, so A lookups resolve to
      # loopback while SRV lookups go out to the container's DNS. That is the
      # whole trick; removing either half breaks it.
      - name: Map the test domain to the published LDAP and DNS ports
        shell: powershell
        run: |
          # The WSL VM's address, not 127.0.0.1. These A records have to carry
          # UDP as well as TCP now: the DC Locator's CLDAP ping goes to UDP 389,
          # and WSL2's localhost relay forwards TCP but not UDP -- the same
          # constraint already recorded below for DNS, which was solved there and
          # only there. A datagram sent to 127.0.0.1 simply never arrives.
          #
          # eth0's address carries both, and "-p 389:389/tcp" binds 0.0.0.0
          # inside the VM, so TCP is served over the same address that UDP is.
          # One routable address therefore replaces the previous split
          # arrangement rather than extending it: these entries exist only to
          # override Samba's own answer of the container-internal 10.88.x.x,
          # which Windows has no route to, and any routable address does that.
          # The NRPT rule below is unchanged and still required -- a hosts file
          # cannot express the SRV records forest discovery reads.
          $wslIp = (wsl hostname -I).Trim().Split(' ')[0]
          Write-Host "WSL VM IP: $wslIp"

          $hosts = "$env:SystemRoot\System32\drivers\etc\hosts"
          $entries = @(
            "$wslIp example.com",
            "$wslIp dc.example.com"
          )
          Add-Content -Path $hosts -Value ($entries -join "`r`n")

          Write-Host "=== hosts entries for example.com ==="
          Select-String -Path $hosts -Pattern "example\.com" | ForEach-Object { Write-Host $_.Line }

          # Resolved through the OS resolver, which honours the hosts file.
          # nslookup is the wrong tool here twice over: it queries DNS directly
          # and would never see these entries, and it writes its banner to
          # stderr, which "2>&1" turns into a PowerShell error record that fails
          # the step. A diagnostic must not be able to fail the job, so this one
          # cannot throw.
          Write-Host "=== resolution check ==="
          foreach ($name in @("example.com", "dc.example.com")) {
              try {
                  $addresses = [System.Net.Dns]::GetHostAddresses($name)
                  Write-Host "$name -> $(($addresses | ForEach-Object { $_.IPAddressToString }) -join ', ')"
              }
              catch {
                  Write-Host "$name did not resolve: $($_.Exception.Message)"
              }
          }

          # --- EXPERIMENT: static route to the podman bridge ------------------
          # Half of a time-boxed pair; the other half is republishing 88/464.
          # Windows does not need the container on its network, only a route to
          # it, and the WSL VM already forwards because podman requires
          # ip_forward. If Kerberos has been dialling the container's own
          # 10.88.x.x address taken from a DNS glue record, this is what makes
          # that address reachable.
          #
          # Subnet and container address are read from podman, never hardcoded.
          $networkFile = Join-Path $env:GITHUB_WORKSPACE "podman-network.txt"
          $podmanSubnet = $null
          $containerIp = $null
          if (Test-Path $networkFile) {
              $networkFacts = @(Get-Content $networkFile)
              if ($networkFacts.Count -ge 1) { $podmanSubnet = $networkFacts[0].Trim() }
              if ($networkFacts.Count -ge 2) { $containerIp = $networkFacts[1].Trim() }
          }

          Write-Host "=== podman network facts ==="
          Write-Host "  subnet    : $(if ($podmanSubnet) { $podmanSubnet } else { '<not reported>' })"
          Write-Host "  container : $(if ($containerIp) { $containerIp } else { '<not reported>' })"

          if ($podmanSubnet) {
              try {
                  # The interface is found by asking Windows how it reaches the
                  # WSL VM, not by looking $wslIp up as a local address. That
                  # lookup cannot work: $wslIp is the VM's own address, which
                  # lives inside the VM and is not configured on any Windows
                  # adapter -- the Windows end of the vEthernet (WSL) link has a
                  # different address. Find-NetRoute answers the question that
                  # actually matters, which is which interface carries traffic to
                  # the VM, and the bridge route then follows the same path.
                  $routeToVm = Find-NetRoute -RemoteIPAddress $wslIp -ErrorAction Stop | Select-Object -First 1
                  Write-Host "  reaching $wslIp via interface $($routeToVm.InterfaceIndex) ($($routeToVm.InterfaceAlias))"

                  New-NetRoute -DestinationPrefix $podmanSubnet -NextHop $wslIp `
                    -InterfaceIndex $routeToVm.InterfaceIndex `
                    -RouteMetric 1 -ErrorAction Stop | Out-Null
                  Write-Host "  route added: $podmanSubnet via $wslIp"
              }
              catch {
                  # A route that cannot be added is a Stage 1 failure and the
                  # probe below will say so; it must not fail the step here.
                  Write-Host "  route not added: $($_.Exception.Message)"
              }
              Write-Host "=== routes matching the bridge ==="
              Get-NetRoute -ErrorAction SilentlyContinue |
                Where-Object { $_.DestinationPrefix -eq $podmanSubnet } |
                Format-Table DestinationPrefix,NextHop,InterfaceAlias,RouteMetric |
                Out-String | Write-Host
          }
          else {
              Write-Host "  no subnet reported; skipping the route (Stage 1 will fail and say so)"
          }

          # Stage 1: is the bridge reachable at all? No Kerberos involved, so a
          # failure here is a routing problem and nothing else.
          Write-Host "=== EXPERIMENT Stage 1: TCP to the container address ==="
          if ($containerIp) {
              foreach ($port in @(389, 88)) {
                  try {
                      $client = New-Object System.Net.Sockets.TcpClient
                      $connect = $client.BeginConnect($containerIp, $port, $null, $null)
                      if ($connect.AsyncWaitHandle.WaitOne(5000, $false) -and $client.Connected) {
                          Write-Host "  Stage 1: ${containerIp}:${port} REACHABLE"
                      }
                      else {
                          Write-Host "  Stage 1: ${containerIp}:${port} NOT reachable"
                      }
                      $client.Close()
                  }
                  catch {
                      Write-Host "  Stage 1: ${containerIp}:${port} NOT reachable: $($_.Exception.Message)"
                  }
              }
          }
          else {
              Write-Host "  Stage 1: skipped, no container address reported"
          }

          # Stage 2: does an EXPLICIT Kerberos bind succeed? AuthType.Kerberos,
          # not Negotiate, so NTLM cannot satisfy it -- a Negotiate success would
          # prove nothing about Kerberos, and this investigation has twice
          # produced a fix whose stated rationale was wrong.
          Write-Host "=== EXPERIMENT Stage 2: explicit Kerberos bind ==="
          try {
              Add-Type -AssemblyName System.DirectoryServices.Protocols
              $identifier = New-Object System.DirectoryServices.Protocols.LdapDirectoryIdentifier("example.com", 389)
              $connection = New-Object System.DirectoryServices.Protocols.LdapConnection($identifier)
              $connection.SessionOptions.ProtocolVersion = 3
              $connection.SessionOptions.Sealing = $true
              $connection.SessionOptions.Signing = $true
              $connection.AuthType = [System.DirectoryServices.Protocols.AuthType]::Kerberos
              $connection.Credential = New-Object System.Net.NetworkCredential(
                  "Administrator", "AdminPassword123!", "EXAMPLE")
              $connection.Timeout = [TimeSpan]::FromSeconds(20)
              $connection.Bind()
              Write-Host "  Stage 2: Kerberos bind to example.com:389 SUCCEEDED"
              $connection.Dispose()
          }
          catch {
              # The exact error decides the outcome: a KDC error naming the
              # principal is a different answer from a timeout.
              Write-Host "  Stage 2: Kerberos bind FAILED: $($_.Exception.GetType().Name): $($_.Exception.Message)"
              if ($_.Exception.InnerException) {
                  Write-Host "  Stage 2: inner: $($_.Exception.InnerException.Message)"
              }
          }
          # --- end EXPERIMENT --------------------------------------------------

          # NRPT sends only *.example.com queries to the container's DNS, leaving
          # the runner's own resolution (GitHub API, package restore) untouched.
          # Same $wslIp as the hosts entries above, and they must agree.
          Add-DnsClientNrptRule -Namespace ".example.com" -NameServers $wslIp
          Clear-DnsClientCache

          Write-Host "=== NRPT rules ==="
          Get-DnsClientNrptRule | Where-Object { $_.Namespace -like "*example.com" } |
            Format-List Namespace,NameServers | Out-String | Write-Host

          # Samba's DNS needs a moment after provisioning. This is a diagnostic and must
          # never fail the step -- an earlier iteration of this workflow was broken by
          # exactly that (nslookup piped through 2>&1 became a terminating error).
          Write-Host "=== SRV discovery check ==="
          $srvFound = $false
          foreach ($attempt in 1..10) {
              try {
                  $srv = Resolve-DnsName -Name "_ldap._tcp.dc._msdcs.example.com" -Type SRV -ErrorAction Stop
                  $srv | Format-Table -AutoSize | Out-String | Write-Host
                  $srvFound = $true
                  break
              }
              catch {
                  Write-Host "SRV not resolvable yet (attempt $attempt): $($_.Exception.Message)"
                  Start-Sleep -Seconds 3
              }
          }
          if (-not $srvFound) {
              Write-Host "WARNING: SRV records did not resolve. Forest discovery will fail and the group-membership tests will refuse closed."
          }

      # The backend is published framework-dependent against net8.0-windows, so
      # the ASP.NET Core 8 shared runtime has to be on the machine or the apphost
      # cannot start at all. Installing only the 10.0 SDK does not provide it:
      # the 10.0 SDK carries the 10.0 runtimes. The LDAP smoke test, which
      # passes, pins 8.0 for the same reason.
      # ADSI's IADsUser::ChangePassword will not run over an unencrypted,
      # unsigned channel, which was the reason this step was added. That theory
      # has since been ruled out as the cause HERE: the PrincipalContext
      # constructor already defaulted to Negotiate | Signing | Sealing, a live
      # run records sign-and-seal being established with no fallback, and the
      # change is still refused. The step stays because trusting the DC's CA is
      # correct regardless and the SSL fallback depends on it -- it is simply not
      # the fix it was believed to be. Publishing 88/464 did not help either:
      # the first run showed all five ports reachable and the duration unchanged
      # at ~11s, which ruled out the port-timeout theory.
      #
      # Trusting the DC's self-signed CA is what gives ADSI a channel it will
      # use. This is the opposite of disabling certificate validation: the chain
      # is still verified, against a root the runner has been told to trust --
      # the same thing a real deployment does with its own AD CA.
      - name: Extract the Samba AD DC certificate authority
        shell: wsl-bash {0}
        run: |
          WORKSPACE="$(wslpath '${{ github.workspace }}')"

          # Samba's default location, with a search as a fallback in case the
          # image lays it out differently.
          CA_PATH="$(podman exec samba-ad sh -c '
            if [ -f /var/lib/samba/private/tls/ca.pem ]; then
              echo /var/lib/samba/private/tls/ca.pem
            else
              find /var/lib/samba /etc/samba -name "ca.pem" 2>/dev/null | head -1
            fi')"

          if [ -z "${CA_PATH}" ]; then
            echo "ERROR: no ca.pem found in the container. Without the DC's CA the runner"
            echo "       cannot validate its certificate, LDAPS will not be used, and the"
            echo "       password change has no encrypted transport."
            echo "=== tls directory ==="
            podman exec samba-ad sh -c 'ls -la /var/lib/samba/private/tls/ 2>&1' || true
            exit 1
          fi

          echo "Samba CA found at: ${CA_PATH}"
          podman exec samba-ad cat "${CA_PATH}" > "${WORKSPACE}/samba-ca.pem"

          if [ ! -s "${WORKSPACE}/samba-ca.pem" ]; then
            echo "ERROR: extracted CA file is empty."
            exit 1
          fi

          echo "=== extracted CA ==="
          head -1 "${WORKSPACE}/samba-ca.pem"
          wc -c < "${WORKSPACE}/samba-ca.pem" | xargs echo "  bytes:"

      - name: Trust the Samba AD DC certificate authority
        shell: powershell
        run: |
          $pemPath = Join-Path $env:GITHUB_WORKSPACE "samba-ca.pem"
          if (-not (Test-Path $pemPath)) {
              throw "samba-ca.pem was not extracted; the previous step should have failed."
          }

          $certificate = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pemPath)
          Write-Host "Subject    : $($certificate.Subject)"
          Write-Host "Issuer     : $($certificate.Issuer)"
          Write-Host "Thumbprint : $($certificate.Thumbprint)"
          Write-Host "Valid      : $($certificate.NotBefore) .. $($certificate.NotAfter)"

          # LocalMachine\Root, not CurrentUser: the Passcore process is launched
          # detached through Win32_Process.Create and does not necessarily run as
          # the same user this step does.
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("Root", "LocalMachine")
          $store.Open("ReadWrite")
          $store.Add($certificate)
          $store.Close()

          $installed = Get-ChildItem Cert:\LocalMachine\Root |
            Where-Object { $_.Thumbprint -eq $certificate.Thumbprint }
          if (-not $installed) {
              throw "The CA was not present in LocalMachine\Root after the add."
          }
          Write-Host "CA installed into LocalMachine\Root."

          # Diagnostic, not an assertion. It reports WHICH name the certificate
          # validates for, which is the open question: the provider is configured
          # with example.com, while Samba issues its certificate for the DC's own
          # FQDN. If example.com fails and dc.example.com succeeds, the fix is to
          # point LdapHostnames at the DC rather than at the domain.
          # Plain LDAP on 389 with Negotiate -- the same channel the provider
          # uses for every read. Worth probing separately from LDAPS because the
          # two failed independently: binds worked while the hosts entries were
          # on loopback and started returning 0x8007052E ERROR_LOGON_FAILURE once
          # they became routable and a KDC was reachable. If this fails, nothing
          # downstream can work and the reason is here rather than three steps
          # later in an application log.
          Write-Host "=== LDAP bind check on 389, Negotiate (diagnostic; does not fail the step) ==="
          foreach ($target in @("example.com", "dc.example.com")) {
              try {
                  Add-Type -AssemblyName System.DirectoryServices.Protocols
                  $identifier = New-Object System.DirectoryServices.Protocols.LdapDirectoryIdentifier($target, 389)
                  $connection = New-Object System.DirectoryServices.Protocols.LdapConnection($identifier)
                  $connection.SessionOptions.ProtocolVersion = 3
                  $connection.SessionOptions.Sealing = $true
                  $connection.SessionOptions.Signing = $true
                  $connection.AuthType = [System.DirectoryServices.Protocols.AuthType]::Negotiate
                  $connection.Credential = New-Object System.Net.NetworkCredential(
                      "Administrator", "AdminPassword123!", "EXAMPLE")
                  $connection.Timeout = [TimeSpan]::FromSeconds(15)
                  $connection.Bind()
                  Write-Host "  sealed bind to ${target}:389 SUCCEEDED"
                  $connection.Dispose()
              }
              catch {
                  Write-Host "  sealed bind to ${target}:389 failed: $($_.Exception.Message)"
              }
          }

          Write-Host "=== LDAPS bind check (diagnostic; does not fail the step) ==="
          foreach ($target in @("example.com", "dc.example.com")) {
              try {
                  Add-Type -AssemblyName System.DirectoryServices.Protocols
                  $identifier = New-Object System.DirectoryServices.Protocols.LdapDirectoryIdentifier($target, 636)
                  $connection = New-Object System.DirectoryServices.Protocols.LdapConnection($identifier)
                  $connection.SessionOptions.SecureSocketLayer = $true
                  $connection.SessionOptions.ProtocolVersion = 3
                  $connection.AuthType = [System.DirectoryServices.Protocols.AuthType]::Basic
                  $connection.Credential = New-Object System.Net.NetworkCredential(
                      "EXAMPLE\Administrator", "AdminPassword123!")
                  $connection.Timeout = [TimeSpan]::FromSeconds(15)
                  $connection.Bind()
                  Write-Host "  LDAPS bind to ${target}:636 SUCCEEDED -- the certificate validates for this name."
                  $connection.Dispose()
              }
              catch {
                  Write-Host "  LDAPS bind to ${target}:636 failed: $($_.Exception.Message)"
              }
          }

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Kept deliberately: a missing 8.0 ASP.NET Core runtime is invisible in the
      # publish step and only shows up as a process that starts and immediately
      # dies, which is exactly the failure this workflow was hitting.
      - name: Report installed .NET runtimes
        shell: powershell
        run: |
          Write-Host "=== dotnet --list-sdks ==="
          dotnet --list-sdks
          Write-Host "=== dotnet --list-runtimes ==="
          dotnet --list-runtimes

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/Unosquare.PassCore.Web/ClientApp/package-lock.json

      - name: Publish Passcore Backend (AD)
        shell: powershell
        run: |
          dotnet publish .\src\Unosquare.PassCore.Web\Unosquare.PassCore.Web.csproj `
            --configuration Release `
            --runtime win-x64 `
            --framework net8.0-windows `
            --property:PASSCORE_PROVIDER=AD `
            --self-contained false `
            --output ".\passcore_output"
          Get-ChildItem .\passcore_output | Format-Table Name,Length
          if (!(Test-Path ".\passcore_output\Unosquare.PassCore.Web.exe")) {
              throw "Publish did not produce executable."
          }

      # Empties the shipped group lists in the PUBLISHED appsettings.json.
      #
      # This is not belt-and-braces for the empty PasswordProviderOptions in
      # appsettings.ADTest.json -- it is the only thing that actually works.
      # .NET configuration merges the environment file onto the base file per
      # key, and binds arrays by index (RestrictedAdGroups:0, :1, :2). An
      # override that supplies no indices leaves the base's indices in place,
      # and even an explicit "RestrictedAdGroups": [] contributes zero keys and
      # changes nothing. An override cannot SHRINK an array. So the base file's
      # three shipped entries survived into the merged configuration,
      # GroupMembershipPolicy saw a non-empty deny list, and it resolved
      # membership after all -- which is how a run that was supposed to skip
      # group evaluation entirely still failed inside GetGroups().
      #
      # Only the build output is touched, never the repository's shipped sample
      # config. Emptying the arrays in the base file is what finally makes the
      # merged result empty.
      - name: Clear the shipped group lists from the published configuration
        shell: powershell
        run: |
          $settings = ".\passcore_output\appsettings.json"
          $json = Get-Content $settings -Raw

          foreach ($key in @("RestrictedAdGroups", "AllowedAdGroups")) {
              $json = [regex]::Replace(
                  $json,
                  "(?s)`"$key`"\s*:\s*\[[^\]]*\]",
                  "`"$key`": []")
          }

          Set-Content -Path $settings -Value $json -NoNewline

          Write-Host "=== group lists in the published configuration ==="
          Select-String -Path $settings -Pattern "RestrictedAdGroups|AllowedAdGroups" -Context 0,1 |
            ForEach-Object { Write-Host $_.Line }

          # Fail loudly rather than silently re-running group evaluation.
          if (Select-String -Path $settings -Pattern '"(Administrators|Domain Admins|Enterprise Admins)"' -Quiet) {
              throw "Shipped group names still present; GroupMembershipPolicy would not short-circuit."
          }

      - name: Start Passcore
        shell: powershell
        run: |
          $publishDir = (Resolve-Path ".\passcore_output").Path
          $exe = Join-Path $publishDir "Unosquare.PassCore.Web.exe"

          # Absolute redirect paths. Start-Process resolves a relative redirect
          # path against the caller's location rather than -WorkingDirectory, so
          # a bare file name can land somewhere the later dump step never looks —
          # which is why both logs came back empty while the app was clearly
          # doing something.
          $stdout = Join-Path $env:GITHUB_WORKSPACE "passcore.log"
          $stderr = Join-Path $env:GITHUB_WORKSPACE "passcore-error.log"

          # Started detached, deliberately. Start-Process hands the child this
          # step's console; when the step ends Windows tears that console down
          # and takes the app with it. That is exactly what happened -- the app
          # logged "Now listening on: http://localhost:5000", then was already
          # gone when the next step looked, with no exception and no shutdown
          # message, because it was killed rather than failed.
          #
          # Win32_Process.Create does not attach the new process to the caller's
          # console, so it survives the step boundary. cmd.exe owns the
          # redirection and stays alive as the app's parent for as long as the
          # app runs, which also makes it the handle to kill at teardown.
          #
          # The environment is NOT inherited through this path, so the two
          # settings that matter are passed as command-line arguments instead --
          # WebApplication.CreateBuilder(args) binds --environment and --urls as
          # host configuration, so this is equivalent to the env vars without
          # depending on them.
          $commandLine = 'cmd.exe /c ""{0}" --environment ADTest --urls http://localhost:5000 > "{1}" 2> "{2}""' -f $exe, $stdout, $stderr
          Write-Host "Launching: $commandLine"

          $result = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{
              CommandLine      = $commandLine
              CurrentDirectory = $publishDir
          }

          if ($result.ReturnValue -ne 0) {
              throw "Win32_Process.Create failed with return value $($result.ReturnValue)."
          }

          # This is cmd.exe's pid. It lives exactly as long as the app does, so
          # it serves as both the liveness probe and the teardown target.
          $result.ProcessId | Out-File -FilePath backend.pid -Encoding ascii
          Write-Host "Started Passcore host shell with PID $($result.ProcessId)"

      # One gate, with the full budget. Previously a separate step failed the run
      # if nothing was listening after a flat 5 seconds, which made this step's
      # timeout unreachable: the run was already over. Liveness and readiness are
      # checked together here so a process that dies is reported as a death (with
      # its output) rather than as a timeout.
      - name: Wait for Passcore to be ready
        shell: powershell
        run: |
          $passcorepid = [int](Get-Content backend.pid).Trim()
          $deadline = (Get-Date).AddSeconds(90)
          $ready = $false

          do {
              $proc = Get-Process -Id $passcorepid -ErrorAction SilentlyContinue
              if (-not $proc) {
                  Write-Host "Passcore host shell $passcorepid is gone; the app exited during startup."
                  break
              }

              try {
                  $response = Invoke-WebRequest -Uri "http://localhost:5000/api/password" `
                    -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
                  if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) {
                      Write-Host "Status: $($response.StatusCode)"
                      Write-Host "Response: $($response.Content)"
                      Write-Host "Passcore is ready!"
                      $ready = $true
                      break
                  }
              }
              catch {
                  Write-Host "Waiting for Passcore... ($($_.Exception.Message))"
                  Start-Sleep -Seconds 2
              }
          } while ((Get-Date) -lt $deadline)

          if (-not $ready) {
              Write-Host "=== Listening sockets ==="
              Get-NetTCPConnection -State Listen |
                Select-Object LocalAddress,LocalPort,OwningProcess |
                Sort-Object LocalPort | Format-Table | Out-String | Write-Host

              # Dumped here as well as in the always() step at the end: a
              # force-kill discards whatever the app had buffered but not
              # flushed, so this is the last point the output is guaranteed
              # to still be readable.
              Write-Host "=== Passcore Standard Output ==="
              if (Test-Path "$env:GITHUB_WORKSPACE\passcore.log") { Get-Content "$env:GITHUB_WORKSPACE\passcore.log" }
              Write-Host "=== Passcore Error Output ==="
              if (Test-Path "$env:GITHUB_WORKSPACE\passcore-error.log") { Get-Content "$env:GITHUB_WORKSPACE\passcore-error.log" }

              throw "Passcore failed to become ready within 90 seconds."
          }

      - name: Basic Smoke Verification
        shell: bash
        run: |
          curl -fsS http://localhost:5000/api/password | jq -e '.validationRegex'
          echo "Passcore is up and responding!"

      # Proves minPwdLength is really read from the directory rather than
      # falling back.
      #
      # The provider advertises a fallback of 6 when the read fails, and it did
      # fail on every request: DirectoryEntry was handed a bare "host:port",
      # which is not an ADSI path, and returned 0x80005000 E_ADS_BAD_PATHNAME.
      # The degradation was silent by design -- a logged warning and a working
      # request -- so nothing failed and nobody noticed.
      #
      # The seed sets the domain minimum to 9 precisely so the two cases are
      # distinguishable: an 8-character password is ACCEPTED under the fallback
      # of 6 and REJECTED under a working read. Asserting only that the warning
      # is gone would pass against a silent null, which is the other way this
      # can break.
      #
      # The request is rejected by LengthPasswordPolicy, which runs first, so no
      # password is changed and no account state is disturbed.
      - name: Domain minimum password length is read from the directory
        shell: bash
        run: |
          echo "An 8-character password must be rejected: the domain minimum is 9, not the fallback 6"
          RESPONSE=$(curl -s -X POST http://localhost:5000/api/password \
            -H "Content-Type: application/json" \
            -d '{"username": "testuser", "currentPassword": "testpassword", "newPassword": "Ab1!efgh", "newPasswordVerify": "Ab1!efgh"}')
          echo "Response: $RESPONSE"

          # 9: ComplexPassword, which is what LengthPasswordPolicy raises.
          if ! echo "$RESPONSE" | jq -e '.errors[] | select(.errorCode == 9)' >/dev/null; then
            echo "FAIL: an 8-character password was not rejected on length."
            echo "      The domain minimum is 9. Accepting 8 means the provider is"
            echo "      advertising its fallback of 6, i.e. the minPwdLength read is"
            echo "      still failing or silently returning nothing."
            exit 1
          fi

          # The message carries the value that was actually read, so this
          # distinguishes "read 9 correctly" from "rejected for some other reason".
          if ! echo "$RESPONSE" | jq -e '.errors[] | select(.errorCode == 9) | .message | test("9")' >/dev/null; then
            echo "FAIL: rejected on length, but the message does not name 9 as the minimum."
            echo "      Message: $(echo "$RESPONSE" | jq -r '.errors[0].message')"
            exit 1
          fi

      # Forest discovery is the prerequisite the group legs stand on, and the
      # thing that failed under the previous image. Reported BEFORE the legs so
      # that when one fails the log already says which of the three
      # prerequisites was missing, instead of only that membership came back
      # undetermined.
      #
      # Diagnostic only: it must never fail the step. Its job is to explain a
      # later failure, not to become one.
      - name: Report forest discovery prerequisites
        shell: powershell
        run: |
          Write-Host "=== 1. Global catalog SRV record ==="
          try {
              Resolve-DnsName -Name "_gc._tcp.example.com" -Type SRV -ErrorAction Stop |
                Format-Table -AutoSize | Out-String | Write-Host
          }
          catch {
              Write-Host "  _gc._tcp.example.com did not resolve: $($_.Exception.Message)"
          }

          Write-Host "=== 2. Global catalog port reachability ==="
          foreach ($port in @(3268, 3269)) {
              try {
                  $client = New-Object System.Net.Sockets.TcpClient
                  $connect = $client.BeginConnect("dc.example.com", $port, $null, $null)
                  if ($connect.AsyncWaitHandle.WaitOne(5000, $false) -and $client.Connected) {
                      Write-Host "  tcp/$port on dc.example.com reachable"
                  }
                  else {
                      Write-Host "  tcp/$port on dc.example.com NOT reachable"
                  }
                  $client.Close()
              }
              catch {
                  Write-Host "  tcp/$port on dc.example.com NOT reachable: $($_.Exception.Message)"
              }
          }

          # The DC Locator itself. This is the layer that actually failed:
          # Forest.GetForest() cannot proceed without a CLDAP response on UDP
          # 389, and neither a DNS answer nor a TCP connect proves that arrived.
          # Test-NetConnection cannot probe UDP usefully, so the locator is
          # exercised directly and asked what it found.
          Write-Host "=== 2b. DC Locator (CLDAP over UDP 389) ==="
          try {
              $located = & nltest /dsgetdc:example.com 2>&1
              $located | ForEach-Object { Write-Host "  $_" }
              Write-Host "  nltest exit code: $LASTEXITCODE"
              $LASTEXITCODE = 0
          }
          catch {
              Write-Host "  nltest failed: $($_.Exception.Message)"
              $LASTEXITCODE = 0
          }

          Write-Host "=== 3. Forest.GetForest() with the ADTest bind credentials ==="
          try {
              Add-Type -AssemblyName System.DirectoryServices
              $context = New-Object System.DirectoryServices.ActiveDirectory.DirectoryContext(
                  [System.DirectoryServices.ActiveDirectory.DirectoryContextType]::Forest,
                  "example.com",
                  "EXAMPLE\Administrator",
                  "AdminPassword123!")
              $forest = [System.DirectoryServices.ActiveDirectory.Forest]::GetForest($context)
              Write-Host "  Forest name : $($forest.Name)"
              Write-Host "  Forest mode : $($forest.ForestMode)"
              Write-Host "  Root domain : $($forest.RootDomain)"
              Write-Host "  Global catalogs: $(($forest.GlobalCatalogs | ForEach-Object { $_.Name }) -join ', ')"
          }
          catch {
              Write-Host "  Forest.GetForest() failed: $($_.Exception.GetType().Name): $($_.Exception.Message)"
              if ($_.Exception.InnerException) {
                  Write-Host "  inner: $($_.Exception.InnerException.Message)"
              }
          }

      # ---------------------------------------------------------------------
      # Group membership legs
      #
      # Each leg restarts Passcore with different group lists, because
      # configuration is read once at startup. Per-leg values are command-line
      # arguments: the environment is not inherited through Win32_Process.Create,
      # and a configuration override cannot shrink an array, so neither of the
      # obvious alternatives works. See tests/samba-ad/restart-passcore.ps1.
      #
      # Every leg opens with a canary that can only pass under that leg's own
      # configuration. Without it, a restart that silently failed to take effect
      # would leave the previous leg's configuration answering every request,
      # and the remaining assertions could pass for entirely the wrong reason.
      # ---------------------------------------------------------------------
      - name: Restart Passcore for Leg A (restricted and allowed)
        shell: powershell
        run: |
          # Bypass for this process only: a git checkout carries no zone
          # marker, so RemoteSigned should already permit it, but the run
          # should not hinge on the runner default.
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\tests\samba-ad\restart-passcore.ps1 -LegName "A: restricted and allowed" -ExtraArgs @(
            '--ClientSettings:PasswordProviderOptions:RestrictedAdGroups:0=RestrictedGroup',
            '--ClientSettings:PasswordProviderOptions:AllowedAdGroups:0=AllowedGroup'
          )

      - name: Leg A - restricted and allowed groups
        shell: bash
        run: |
          post() {
            curl -s -X POST http://localhost:5000/api/password \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$1\", \"currentPassword\": \"$2\", \"newPassword\": \"NewPassword123!\", \"newPasswordVerify\": \"NewPassword123!\"}"
          }
          # Best-effort: only meaningful when the account was actually allowed
          # through and its password really changed.
          restore() {
            curl -s -X POST http://localhost:5000/api/password \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$1\", \"currentPassword\": \"NewPassword123!\", \"newPassword\": \"testpassword\", \"newPasswordVerify\": \"testpassword\"}" >/dev/null || true
          }

          echo "Canary: restricteduser must be refused with ChangeNotPermitted (6)"
          RESPONSE=$(post restricteduser testpassword)
          echo "Response: $RESPONSE"
          if ! echo "$RESPONSE" | jq -e '.errors[] | select(.errorCode == 6)' >/dev/null; then
            echo "FAIL: canary did not produce ChangeNotPermitted."
            echo "      Either the restart did not pick up Leg A's configuration, or the"
            echo "      deny list is not being applied. Every later assertion in this leg"
            echo "      would be answered by the wrong configuration."
            exit 1
          fi

          echo "unlisteduser must be refused: in no allowed group"
          RESPONSE=$(post unlisteduser testpassword)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | jq -e '.errors[] | select(.errorCode == 6)'

          # Positive control. Without it a provider that refused everything --
          # for instance because membership came back undetermined -- would pass
          # both assertions above and look correct.
          echo "testuser must be permitted: member of AllowedGroup, in no restricted group"
          RESPONSE=$(post testuser testpassword)
          echo "Response: $RESPONSE"
          CODE=$(echo "$RESPONSE" | jq -r '.errors[0].errorCode // empty')
          if [[ "$CODE" == "3" || "$CODE" == "4" || "$CODE" == "6" ]]; then
            echo "FAIL: positive control returned $CODE; the leg is refusing an account it should allow."
            exit 1
          fi
          restore testuser

      - name: Restart Passcore for Leg B (transitive membership)
        shell: powershell
        run: |
          # Bypass for this process only: a git checkout carries no zone
          # marker, so RemoteSigned should already permit it, but the run
          # should not hinge on the runner default.
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\tests\samba-ad\restart-passcore.ps1 -LegName "B: transitive membership" -ExtraArgs @(
            '--ClientSettings:PasswordProviderOptions:AllowedAdGroups:0=NestedOuter'
          )

      - name: Leg B - transitive membership
        shell: bash
        run: |
          post() {
            curl -s -X POST http://localhost:5000/api/password \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$1\", \"currentPassword\": \"$2\", \"newPassword\": \"NewPassword123!\", \"newPasswordVerify\": \"NewPassword123!\"}"
          }
          restore() {
            curl -s -X POST http://localhost:5000/api/password \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$1\", \"currentPassword\": \"NewPassword123!\", \"newPassword\": \"testpassword\", \"newPasswordVerify\": \"testpassword\"}" >/dev/null || true
          }

          # Canary and the leg's substance at once: nesteduser is a member of
          # NestedInner only, so permitting it requires transitive expansion.
          # Under Leg A's configuration this same request is refused, so a
          # restart that did not take effect fails here.
          echo "Canary: nesteduser must be permitted via NestedInner -> NestedOuter"
          RESPONSE=$(post nesteduser testpassword)
          echo "Response: $RESPONSE"
          CODE=$(echo "$RESPONSE" | jq -r '.errors[0].errorCode // empty')
          if [[ "$CODE" == "3" || "$CODE" == "4" || "$CODE" == "6" ]]; then
            echo "FAIL: nesteduser returned $CODE."
            echo "      A 6 means either transitive membership was not resolved, or the"
            echo "      restart did not pick up Leg B's configuration."
            exit 1
          fi
          restore nesteduser

          echo "unlisteduser must be refused: not a member of NestedOuter by any path"
          RESPONSE=$(post unlisteduser testpassword)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | jq -e '.errors[] | select(.errorCode == 6)'

      - name: Restart Passcore for Leg C (primary group)
        shell: powershell
        run: |
          # Bypass for this process only: a git checkout carries no zone
          # marker, so RemoteSigned should already permit it, but the run
          # should not hinge on the runner default.
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\tests\samba-ad\restart-passcore.ps1 -LegName "C: primary group" -ExtraArgs @(
            '--ClientSettings:PasswordProviderOptions:AllowedAdGroups:0=Domain Users'
          )

      - name: Leg C - primary group membership
        shell: bash
        run: |
          post() {
            curl -s -X POST http://localhost:5000/api/password \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$1\", \"currentPassword\": \"$2\", \"newPassword\": \"NewPassword123!\", \"newPasswordVerify\": \"NewPassword123!\"}"
          }
          restore() {
            curl -s -X POST http://localhost:5000/api/password \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$1\", \"currentPassword\": \"NewPassword123!\", \"newPassword\": \"testpassword\", \"newPasswordVerify\": \"testpassword\"}" >/dev/null || true
          }

          # Domain Users is every account's PRIMARY group and appears in no
          # memberOf attribute, so resolving it requires the primary-group path
          # specifically. This is the case that silently denies everyone if that
          # path regresses, and "allow anyone in Domain Users" is a rule a real
          # operator would plausibly write.
          #
          # Canary: under Leg B's configuration this request is refused, so a
          # restart that did not take effect fails here.
          echo "Canary: testuser must be permitted via the Domain Users primary group"
          RESPONSE=$(post testuser testpassword)
          echo "Response: $RESPONSE"
          CODE=$(echo "$RESPONSE" | jq -r '.errors[0].errorCode // empty')
          if [[ "$CODE" == "3" || "$CODE" == "4" || "$CODE" == "6" ]]; then
            echo "FAIL: testuser returned $CODE."
            echo "      A 6 means primary-group membership was not resolved: Domain Users"
            echo "      is in no memberOf attribute, so only the primary-group path finds it."
            exit 1
          fi
          restore testuser

      - name: Restart Passcore for Leg D (group type characterization)
        shell: powershell
        run: |
          # Bypass for this process only: a git checkout carries no zone
          # marker, so RemoteSigned should already permit it, but the run
          # should not hinge on the runner default.
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\tests\samba-ad\restart-passcore.ps1 -LegName "D: group type" -ExtraArgs @(
            '--ClientSettings:PasswordProviderOptions:AllowedAdGroups:0=DistributionGroup'
          )

      # CHARACTERIZATION TEST -- it pins what the provider does today, not what
      # it ought to do.
      #
      # ResolveMembershipAsync unions GetAuthorizationGroups(), which returns
      # security groups only, with GetGroups(), which also returns distribution
      # groups. So a distribution group currently matches, and this leg asserts
      # that.
      #
      # Whether it SHOULD match is an open design question, and the leaning is
      # towards security-groups-only. If that decision is taken, this expectation
      # is expected to invert -- flipping it is then the correct response, and
      # this comment is the notice that doing so is deliberate rather than a
      # regression. Do not change provider code to make this leg produce a
      # preferred answer; the decision comes first.
      - name: Leg D - group type (characterization)
        shell: bash
        run: |
          post() {
            curl -s -X POST http://localhost:5000/api/password \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$1\", \"currentPassword\": \"$2\", \"newPassword\": \"NewPassword123!\", \"newPasswordVerify\": \"NewPassword123!\"}"
          }
          restore() {
            curl -s -X POST http://localhost:5000/api/password \
              -H "Content-Type: application/json" \
              -d "{\"username\": \"$1\", \"currentPassword\": \"NewPassword123!\", \"newPassword\": \"testpassword\", \"newPasswordVerify\": \"testpassword\"}" >/dev/null || true
          }

          # Canary: unlisteduser belongs to no group named in this leg. Under
          # Leg C's configuration it would be permitted via Domain Users, so a
          # restart that did not take effect fails here rather than letting the
          # characterization below record a value from the wrong configuration.
          echo "Canary: unlisteduser must be refused under AllowedAdGroups=[DistributionGroup]"
          RESPONSE=$(post unlisteduser testpassword)
          echo "Response: $RESPONSE"
          if ! echo "$RESPONSE" | jq -e '.errors[] | select(.errorCode == 6)' >/dev/null; then
            echo "FAIL: canary did not produce ChangeNotPermitted; Leg D's configuration is not active."
            exit 1
          fi

          echo "distributionuser: characterizing how a distribution group is treated"
          RESPONSE=$(post distributionuser testpassword)
          echo "Response: $RESPONSE"
          CODE=$(echo "$RESPONSE" | jq -r '.errors[0].errorCode // empty')
          if [[ "$CODE" == "3" || "$CODE" == "4" || "$CODE" == "6" ]]; then
            echo "FAIL: distributionuser returned $CODE, but current behaviour is that a"
            echo "      distribution group matches, because GetGroups() includes them."
            echo ""
            echo "      If security-groups-only semantics were deliberately adopted, this"
            echo "      expectation is meant to invert -- see the comment on this step."
            echo "      Flip it deliberately; do not delete it."
            exit 1
          fi
          restore distributionuser

      # Back to the baseline configuration before Test 1. Leg D left
      # AllowedAdGroups=[DistributionGroup] in force, under which alloweduser is
      # refused outright and never reaches the change path Test 1 exists to
      # exercise.
      - name: Restart Passcore with no group lists
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\tests\samba-ad\restart-passcore.ps1 -LegName "baseline: no group lists"

      # ---------------------------------------------------------------------
      # What these assertions cover, and the two things that make them possible
      #
      # Group membership is exercised by the legs further down, each of which
      # restarts Passcore with different group lists. Two mechanisms underpin
      # that, and both are easy to undo by accident:
      #
      # 1. Configuration arrays cannot be SHRUNK by an override. .NET binds
      #    arrays by index and merges per key, so an environment file that omits
      #    RestrictedAdGroups -- or supplies [] -- leaves the base file's shipped
      #    entries in the merged result. That is why the step "Clear the shipped
      #    group lists from the published configuration" empties them in the
      #    PUBLISHED base file, and why per-leg values arrive as command-line
      #    arguments, which sit last in the configuration chain and win outright.
      #    Removing either half silently restores the shipped deny list and every
      #    leg then tests the wrong configuration.
      #
      # 2. GetGroups() is topology discovery, not an LDAP search. It goes
      #    through ADStoreCtx.GetGroupsMemberOf into Forest.GetForest(), which
      #    resolves the forest, locates a DC, reads the site name, and binds over
      #    GC:// on 3268 -- which is what the published global catalog ports and
      #    the split DNS above are for. Under the previous AD LDS-shaped image
      #    this failed outright, membership came back undetermined, and the group
      #    assertions could not run at all.
      #
      # The provider refuses when membership is undetermined rather than
      # treating "could not tell" as "not a member". That is the deny-list
      # fail-closed guarantee: answering "not a member" for a membership that
      # could not be determined would let a member of a restricted group through
      # during a partial directory failure. If a leg fails because membership is
      # undetermined, fix the environment or the assertion -- never the check.
      # ---------------------------------------------------------------------
      - name: AD Success and Authorization Tests
        shell: bash
        run: |
          # Called only on failure. Reachability alone has already been shown NOT
          # to be the whole story -- a run with every one of these ports open
          # still failed with E_ACCESSDENIED, because ADSI will not change a
          # password over an unencrypted channel. So read this together with the
          # LDAPS bind check in the "Trust the Samba AD DC certificate authority"
          # step: all-reachable here plus a failed LDAPS bind there means the
          # certificate is not validating for the name being connected to.
          report_transports() {
            echo "  --- change-password transport reachability (TCP only; UDP not probeable here) ---"
            for port in 389 636 464 88 3268; do
              if (echo > /dev/tcp/dc.example.com/${port}) >/dev/null 2>&1; then
                echo "    tcp/${port} reachable"
              else
                echo "    tcp/${port} NOT reachable"
              fi
            done
            echo "    note: 445 (SMB/NetUserChangePassword) is never published -- Windows binds it."
          }

          # Test 1 asserts that the password CHANGED. It previously asserted only
          # that the response was not error code 3, 4 or 6, which an
          # E_ACCESSDENIED from a failed change satisfies -- so the change had
          # never once succeeded while the step reported green.
          #
          # alloweduser is used ONLY here. No later leg asserts on it, and Test 1b
          # changes it back, so nothing downstream can inherit a changed password.
          echo "Test 1: password change succeeds"
          RESPONSE=$(curl -s -X POST http://localhost:5000/api/password \
            -H "Content-Type: application/json" \
            -d '{"username": "alloweduser", "currentPassword": "testpassword", "newPassword": "NewPassword123!", "newPasswordVerify": "NewPassword123!"}')
          echo "Response: $RESPONSE"
          if ! echo "$RESPONSE" | jq -e '(.errors // []) | length == 0' >/dev/null; then
            echo "FAIL: the password change did not succeed."
            echo "      This asserts the change HAPPENED. Do not relax it to tolerate an"
            echo "      error code -- that is what hid this for the life of the workflow."
            report_transports
            exit 1
          fi

          # Proves the change took effect through a real authentication, not
          # through the absence of an error: the directory must now accept the
          # NEW password as the current one. This request is also the restore, so
          # alloweduser ends the step exactly as it started.
          echo "Test 1b: new password is in effect, and the account is restored"
          RESPONSE=$(curl -s -X POST http://localhost:5000/api/password \
            -H "Content-Type: application/json" \
            -d '{"username": "alloweduser", "currentPassword": "NewPassword123!", "newPassword": "testpassword", "newPasswordVerify": "testpassword"}')
          echo "Response: $RESPONSE"
          if ! echo "$RESPONSE" | jq -e '(.errors // []) | length == 0' >/dev/null; then
            echo "FAIL: could not change back using the new password as the current one."
            echo "      Either the first change did not really take effect, or the account"
            echo "      is now left on NewPassword123! -- later legs assume testpassword."
            report_transports
            exit 1
          fi

          echo "Test 2: Invalid current password"
          RESPONSE=$(curl -s -X POST http://localhost:5000/api/password \
            -H "Content-Type: application/json" \
            -d '{"username": "testuser", "currentPassword": "wrongpassword", "newPassword": "NewPassword123!", "newPasswordVerify": "NewPassword123!"}')
          echo "Response: $RESPONSE"
          echo $RESPONSE | jq -e '.errors[] | select(.errorCode == 4)'

          echo "Test 3: Unknown user (Informative Mode)"
          RESPONSE=$(curl -s -X POST http://localhost:5000/api/password \
            -H "Content-Type: application/json" \
            -d '{"username": "nonexistent", "currentPassword": "somepassword", "newPassword": "NewPassword123!", "newPasswordVerify": "NewPassword123!"}')
          echo "Response: $RESPONSE"
          # 3: UserNotFound
          echo $RESPONSE | jq -e '.errors[] | select(.errorCode == 3)'

          # Tests 4 and 5 -- restricted group and allowed group -- used to sit
          # here. See the parity note above this step for why they are gone and
          # what it would take to bring them back.

      - name: Stop the Samba AD DC
        shell: powershell
        run: wsl podman stop samba-ad

      - name: AD Environment Failure Test
        shell: bash
        run: |
          echo "Attempting password change during AD outage..."
          RESPONSE=$(curl -s -X POST http://localhost:5000/api/password \
            -H "Content-Type: application/json" \
            -d '{"username": "testuser", "currentPassword": "testpassword", "newPassword": "NewPassword123!", "newPasswordVerify": "NewPassword123!"}')
          echo "Response: $RESPONSE"
          # Expect LdapProblem (8) or InvalidCredentials (4)
          echo $RESPONSE | jq -e '.errors[] | select(.errorCode == 4 or .errorCode == 8)'

      - name: Start the Samba AD DC
        shell: powershell
        run: wsl podman start samba-ad

      - name: Check Samba AD DC logs
        if: always()
        shell: powershell
        run: wsl podman logs samba-ad

      # Before Stop Passcore, deliberately. When stdout is redirected to a file
      # .NET buffers it, and Stop-Process -Force terminates without flushing, so
      # dumping after the kill can silently discard the very output being sought.
      - name: Dump Passcore Startup Logs
        if: always()
        shell: powershell
        run: |
          $stdout = Join-Path $env:GITHUB_WORKSPACE "passcore.log"
          $stderr = Join-Path $env:GITHUB_WORKSPACE "passcore-error.log"

          Write-Host "=== Passcore Standard Output ==="
          if (Test-Path $stdout) { Get-Content $stdout } else { Write-Host "(no $stdout)" }

          Write-Host "=== Passcore Error Output ==="
          if (Test-Path $stderr) { Get-Content $stderr } else { Write-Host "(no $stderr)" }

      - name: Stop Passcore
        if: always()
        shell: powershell
        run: |
          if (Test-Path backend.pid) {
            $passcorepid = (Get-Content backend.pid).Trim()
            # /T because the pid is cmd.exe's and the app is its child; killing
            # the shell alone would leave the app holding port 5000.
            #
            # No "2>&1": taskkill writes to stderr when the pid is already gone,
            # and piping that into PowerShell turns it into an error record that
            # fails the step -- which would let teardown fail a run whose tests
            # all passed. Teardown of an already-dead process is a success here,
            # so the exit code is reset rather than propagated.
            Write-Host "Stopping Passcore process tree rooted at PID $passcorepid..."
            & taskkill /F /T /PID $passcorepid
            Write-Host "taskkill exit code: $LASTEXITCODE"
            $LASTEXITCODE = 0
          }

      - name: Cleanup Samba AD DC container
        if: always()
        shell: powershell
        run: wsl podman rm -f samba-ad
