name: Build Windows Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*' # Trigger workflow on tags like v1.0.0, v2.0.1, etc.

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read      # Needed to check out code
    name: Windows Binaries on Windows Latest
    runs-on: windows-latest

    steps:
    # This workflow builds release binaries from a v*.*.* tag, so there is
    # nothing to supersede: every run corresponds to a distinct release, and
    # cancelling an earlier one means that release's binaries are never built.
    # build_docker.yml, which publishes from the same tags, has never had a
    # cancellation step -- this one was the anomaly.
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup .NET 10.0 SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
      with:
        node-version: 22 # Plan move to 24 if dependencies support it
        cache: npm
        cache-dependency-path: |
          src/Unosquare.PassCore.Web/ClientApp/package-lock.json


    - name: Extract version and repo info
      if: startsWith(github.ref, 'refs/tags/v')
      id: vars
      shell: pwsh
      run: |
        $tagName = "${{ github.ref_name }}"
        $version = $tagName.TrimStart('v')
        $repoName = "${{ github.repository }}".Split('/')[-1]
        
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT
        echo "repo_name=$repoName" >> $env:GITHUB_OUTPUT

    - name: Set package.json version
      if: startsWith(github.ref, 'refs/tags/v')
      working-directory: ./ClientApp
      run: npm version ${{ steps.vars.outputs.version }}

    - name: Build and Publish Windows Binaries
      shell: pwsh
      run: |
        dotnet publish .\src\Unosquare.PassCore.Web\Unosquare.PassCore.Web.csproj --configuration Release --runtime win-x64 --framework net8.0-windows --property:PASSCORE_PROVIDER=AD --self-contained false --output ".\passcore_output"
        Get-ChildItem -Path ".\passcore_output"

    - name: Upload Binaries
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: passcore-${{ steps.vars.outputs.version || 'latest' }}
        path: .\passcore_output
