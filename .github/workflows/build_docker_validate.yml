name: Docker Build Validation

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Catch syntax errors and best-practice violations early
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Build and LOAD to the local daemon
      - name: Build and load image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: passcore:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dynamic Smoke Test (Wait for 200 OK)
      - name: Run container smoke test
        run: |
          docker run -d -p 8080:8080 --name passcore_test -e AppSettings__LdapHostnames__0='localhost' -e AppSettings__LdapUsername='CN=admin,OU=Users,DC=example,DC=com' -e AppSettings__LdapPassword='password' passcore:ci-test

          echo "Waiting for Passcore endpoint..."
          timeout 30s bash -c 'until curl -f http://localhost:8080; do sleep 2; done' || (docker logs passcore_test && exit 1)

          docker stop passcore_test
          echo "Endpoint responded successfully!"

      - name: Cleanup test container
        if: always()
        run: docker rm -f passcore_test || true
