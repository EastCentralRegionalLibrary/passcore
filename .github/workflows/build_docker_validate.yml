name: Docker Build Validation

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Catch syntax errors and best-practice violations early
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Build and LOAD to the local daemon
      - name: Build and load image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          load: true
          tags: passcore:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dynamic Smoke Test (Wait for 200 OK)
      - name: Run container smoke test
        run: |
          docker run -d -p 8080:8080 --name passcore_test -e AppSettings__LdapHostnames__0='localhost' -e AppSettings__LdapUsername='CN=admin,OU=Users,DC=example,DC=com' -e AppSettings__LdapPassword='password' passcore:ci-test

          echo "Waiting for Passcore endpoint..."
          timeout 30s bash -c 'until curl -f http://localhost:8080; do sleep 2; done' || (docker logs passcore_test && exit 1)

          docker stop passcore_test
          echo "Endpoint responded successfully!"

      - name: Cleanup test container
        if: always()
        run: docker rm -f passcore_test || true
